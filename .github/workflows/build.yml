name: Build

# Builds Kelvra.exe on every push / pull request.
# Pushing a tag like "v1.0.0" also creates a GitHub Release with the exe and its SHA-256 checksum.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pick version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0-ci.${{ github.run_number }}" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/Kelvra.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: >
          dotnet publish Kelvra.csproj -c Release -o out
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ env.VERSION }}

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Kelvra.exe -Algorithm SHA256).Hash
          "$hash  Kelvra.exe" | Out-File out/Kelvra.exe.sha256 -Encoding ascii
          "### Kelvra ${{ env.VERSION }}`nSHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Kelvra-${{ env.VERSION }}
          path: |
            out/Kelvra.exe
            out/Kelvra.exe.sha256

      # The release description is the annotated tag's message (git tag -a vX.Y.Z -F notes.md)
      - name: Release notes from the tag message
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" | Out-File release-notes.md -Encoding utf8

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            out/Kelvra.exe
            out/Kelvra.exe.sha256
          generate_release_notes: true
